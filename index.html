<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 1. 브라우저 탭에 뜨는 제목 -->
    <title>너를 초대해💌</title>

    <!-- 2. 링크 공유 시 뜨는 제목 (Open Graph) -->
    <meta property="og:title" content="너를 초대해💌">

    <!-- 1. 폰트: Pretendard (Apple 스타일) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- 2. 애니메이션 라이브러리 CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- 3. 커스텀 스타일 -->
    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* 로딩 화면 스타일 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #6366f1;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 로딩 스크린 -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- 초대장 콘텐츠가 렌더링되는 곳 -->
    <div id="app"></div>

    <!-- 외부 라이브러리 JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- 프로젝트 JS (순서가 매우 중요합니다) -->
    <script src="./js/utils.js"></script>
    <script src="./js/renderer.js"></script>

    <script>
        // 메인 실행 로직
        async function initApp() {
            try {
                // 1. 데이터 가져오기 (로컬 저장소 우선, 없으면 서버 파일)
                let config;
                const saved = localStorage.getItem('retreat_config');
                
                if (saved) {
                    config = JSON.parse(saved);
                    console.log("로컬 데이터를 사용합니다.");
                } else {
                    const response = await fetch('./config.json?v=' + Date.now());
                    config = await response.json();
                    console.log("서버 데이터를 사용합니다.");
                }

                // 2. 화면 그리기 (Renderer 실행)
                Renderer.init(config);

                // 3. 애니메이션 초기화 (화면을 다 그린 후 실행해야 버튼이 보입니다)
                setTimeout(() => {
                    AOS.init({
                        duration: 1000,
                        once: true,    // 애니메이션 한 번만 실행
                        offset: 50,    // 50px만 보여도 바로 나타나게 함 (버튼 안 보임 해결)
                        easing: 'ease-out-back'
                    });
                    
                    // 로딩 화면 제거
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 100);

            } catch (error) {
                console.error("앱 초기화 중 오류 발생:", error);
                document.getElementById('app').innerHTML = `
                    <div style="text-align:center; padding:100px 20px;">
                        <p>초대장 데이터를 불러올 수 없습니다.</p>
                        <button onclick="location.reload()">새로고침</button>
                    </div>
                `;
            }
        }

        // 페이지 로드 시 실행
        window.onload = initApp;
    </script>
</body>
</html>
