<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초대장 관리자 모드</title>
    <!-- Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="admin-app">
        <!-- 사이드바: 카드 목록 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>CMS Dashboard</h2>
                <p>수련회 초대장 관리</p>
            </div>
            
            <div class="card-list-wrapper">
                <div class="section-title">
                    <span>카드 구성</span>
                    <button id="btnAddCard" class="btn-icon-add" title="새 카드 추가"><i class="fa fa-plus"></i></button>
                </div>
                <ul id="card-list" class="sortable-list">
                    <!-- admin.js에서 동적 생성 -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <button id="btnReset" class="btn-secondary">초기화</button>
            </div>
        </aside>

        <!-- 메인 콘텐츠: 편집기 -->
        <main class="editor-main">
            <header class="editor-header">
                <div class="status-info">
                    <span id="current-card-type">카드를 선택해주세요</span>
                </div>
                <div class="action-buttons">
                    <a href="index.html" target="_blank" class="btn-preview"><i class="fa fa-external-link"></i> 미리보기</a>
                    <button id="btnDownload" class="btn-download"><i class="fa fa-download"></i> JSON 저장(배포용)</button>
                    <button id="btnSave" class="btn-primary"><i class="fa fa-save"></i> 설정 저장</button>
                </div>
            </header>

            <div id="editor-panel" class="editor-content">
                <!-- 선택된 카드의 입력 폼이 여기에 생성됨 -->
                <div class="empty-state">
                    <i class="fa fa-mouse-pointer"></i>
                    <p>편집할 카드를 왼쪽 목록에서 선택하세요.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 모달: 카드 추가 -->
    <div id="addCardModal" class="modal">
        <div class="modal-content">
            <h3>새 카드 추가</h3>
            <div class="card-type-grid">
                <button data-type="Hero">Hero (메인)</button>
                <button data-type="Text">Text (문구)</button>
                <button data-type="Application">Application (신청)</button>
                <button data-type="Info">Info (장소/지도)</button>
                <button data-type="Poster">Poster (포스터)</button>
                <button data-type="Schedule">Schedule (일정)</button>
                <button data-type="Video">Video (영상)</button>
                <button data-type="Playlist">Playlist (찬양)</button>
                <button data-type="Intro">Intro (소개)</button>
                <button data-type="FAQ">FAQ (질문)</button>
                <button data-type="Gallery">Gallery (갤러리)</button>
            </div>
            <button class="btn-close-modal">취소</button>
        </div>
    </div>

    <!-- 프로젝트 스크립트 -->
    <script src="./js/utils.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>
